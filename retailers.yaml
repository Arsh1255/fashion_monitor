# Add the logo field to each retailer entry in D:\fashion_monitor\retailers.yaml.
# The existing YAML loader needs no changes.
hm_india:
  enabled: true
  name: "H&M India"
  region: "India"
  logo: "assets/pdf/logos/hm-seeklogo.png"
  categories:
    Men: "https://www2.hm.com/en_in/men/new-arrivals/view-all.html"
    Women: "https://www2.hm.com/en_in/ladies/new-arrivals/view-all.html"

hm_us:
  enabled: true
  name: "H&M US"
  region: "US"
  logo: "assets/pdf/logos/hm-seeklogo.png"
  categories:
    Men: "https://www2.hm.com/en_us/men/new-arrivals/view-all.html"
    Women: "https://www2.hm.com/en_us/women/new-arrivals/view-all.html"

zara:
  enabled: false
  name: "Zara"
  region: "India"
  logo: "assets/pdf/logos/zara.png"
  categories:
    Men: ""
    Women: ""

lacoste:
  enabled: false
  name: "Lacoste"
  region: "India"
  logo: "assets/pdf/logos/lacoste.png"
